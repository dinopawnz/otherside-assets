    const game = Object.assign({ now: now(), built: !!GAME, builtAt, lite: !!LITE, online: ONLINE.size, err: LAST_ERR }, GAME ? GAME.game() : { ph: "idle" });
    remoteBoard.setAttribute("data-game", JSON.stringify(game));
  }
  _setI(paintRemote, 1000);

  // LITE: the decoration models (grass, candy dressing, ripples, smoke) are removed; everything solid stays
  const DECOR = /cf_(ripple|ring|smoke)|h_(choc_flower|candy_flower|sweets|candy_pumpkin|rock_candy|gummy|icecream|macarons|truffles|donut|choc_rock|mint_lamp|choc_bench)/;
  function liteOn() {
    if (LITE) return "LITE MODE IS ALREADY ON";
    const out = Array.from(WORLD.querySelectorAll("m-model")).filter((m) => DECOR.test(m.getAttribute("src") || ""));
    LITE = { removed: out.map((n) => ({ n, parent: n.parentNode, next: n.nextSibling })) };
    LITE.removed.forEach((r) => r.n.remove());
    return "LITE MODE ON - " + LITE.removed.length + " DECORATION PIECES REMOVED";
  }
  function liteOff() {
    if (!LITE) return "LITE MODE IS ALREADY OFF";
    LITE.removed.slice().reverse().forEach((r) => { if (r.next && r.next.parentNode === r.parent) r.parent.insertBefore(r.n, r.next); else r.parent.appendChild(r.n); });
    const n = LITE.removed.length; LITE = null;
    return "LITE MODE OFF - " + n + " PIECES ARE BACK";
  }
  function refreshAll() {
    if (!WORLD) return "NOT BUILT";
    const kids = Array.from(WORLD.children);
    kids.forEach((g) => { g.remove(); WORLD.appendChild(g); });
    return "REFRESHED - " + kids.length + " PARTS RE-SENT. DOORS, BOATS AND CODES KEPT.";
  }
  function build() {
    if (GAME) return "ALREADY BUILT";
    WORLD = el("m-group", { z: -FRONT }, rootGroup);
    ROOT = WORLD;
    placer.setAttribute("y", PARK);
    try { GAME = buildWorld(); } catch (e) { hostMsg("BUILD ERROR: " + (e && e.message)); }
    builtAt = now();
    return "LIVE BUILD ON - THE CHOCOLATE FACTORY IS UP";
  }
  function unbuild() {
    if (!WORLD) return "ALREADY FOLDED";
    LITE = null;
    TIMERS.forEach((h) => _clrT(h)); TIMERS.clear();
    INTERVALS.forEach((h) => _clrI(h)); INTERVALS.clear();
    LISTENERS.forEach(([ev, f]) => window.removeEventListener(ev, f)); LISTENERS.length = 0;
    WORLD.remove(); WORLD = null; GAME = null; ROOT = rootGroup;
    placer.setAttribute("y", 0);
    return "LIVE BUILD OFF - BACK TO THE PLACER";
  }
  hostPrompt.addEventListener("prompt", (e) => {
    const raw = String((e && e.detail && e.detail.value) || "").replace(/\s+/g, " ").trim();
    if (raw.indexOf(HOST_CODE) !== 0) { hostMsg("WRONG CODE"); return; }
    const rest = raw.slice(HOST_CODE.length).trim();
    const parts = rest.split(" ").filter(Boolean);
    const cmd = (parts[0] || "").toLowerCase();
    const id = e.detail.connectionId;
    if (cmd === "remote") {
      if (id === undefined) { hostMsg("REMOTE: NO CONNECTION ID"); return; }
      REMOTES.add(id); ONLINE.delete(id); remoteBoard.setAttribute("visible-to", Array.from(REMOTES).join(" "));
      hostMsg("UNLOCKED"); paintRemote(); return;
    }
    if (cmd === "build") { hostMsg(build()); return; }
    if (cmd === "unbuild") { hostMsg(unbuild()); return; }
    if (!GAME) { hostMsg("NOT BUILT YET - PRESS LIVE BUILD FIRST"); return; }
    if (cmd === "lite") { const a = (parts[1] || "").toLowerCase(); hostMsg(a === "off" ? liteOff() : a === "on" ? liteOn() : LITE ? liteOff() : liteOn()); return; }
    if (cmd === "refresh") { hostMsg(refreshAll()); return; }
    let reply = null;
    try { reply = GAME.command(cmd, parts.slice(1)); } catch (err) { reply = "ERROR: " + (err && err.message); }
    hostMsg(reply || "UNKNOWN: " + cmd);
  });
  window.addEventListener("connected", (e) => { if (e.detail && !REMOTES.has(e.detail.connectionId)) ONLINE.add(e.detail.connectionId); });
  window.addEventListener("disconnected", (e) => {
    const c = e.detail.connectionId;
    ONLINE.delete(c);
    if (REMOTES.delete(c)) remoteBoard.setAttribute("visible-to", REMOTES.size ? Array.from(REMOTES).join(" ") : "-1");
  });

  // ==========================================================
  // THE WORLD
  // ==========================================================
  function buildWorld() {
    const L = D.L;
    // ---------------------------------------------------------------- 1. outside + collisions (straight away)
    D.col.forEach((f) => model(f, { collide: "true" }));
    // the Meshy heroes: [model, x, y, z, ry, sx, sy, sz]
    const hero = ([n, x, y, z, ry, sx, sy, sz]) => model("h_" + n, { x, y, z, ry, sx, sy, sz });
    ["cf_shell", "cf_sign", "cf_courtyard"].forEach((f) => model(f));
    D.dress.court.forEach(hero);
    // ---------------------------------------------------------------- 2. inside (staged so the outside appears first)
    later(2500, () => {
      ["cf_hall", "cf_room_shell", "cf_meadow", "cf_river", "cf_portal"].forEach((f) => model(f));
      D.dress.room.forEach(hero);
    });
    later(5000, () => { ["cf_tunnel", "cf_ramp_water", "cf_f2"].forEach((f) => model(f)); D.dress.up.forEach(hero); });

    // ---------------------------------------------------------------- moving chocolate
    later(3000, () => {
      // the waterfall pours: the sheet slides down one texture repeat per loop
      const falls = model("cf_falls");
      anim(falls, "y", 0, -D.fx.falls_rep, 1100, {});
      // ripples drifting down the river: each glides along its run, rising out of the chocolate and sinking back in
      D.fx.runs.forEach(([x0, z0, x1, z1, ry, dur, ph, v, s]) => {
        const m = model("cf_ripple_" + v, { x: x0, y: L.W0 + 0.02, z: z0, ry, sx: s, sz: s });
        anim(m, "x", x0, x1, dur, { delay: ph }); anim(m, "z", z0, z1, dur, { delay: ph });
        anim(m, "y", L.W0 - 0.06, L.W0 + 0.03, dur / 2, { delay: ph, pingPong: true, easing: "easeInOutSine" });
      });
      // rings spreading across the plunge pool and the fountain basins
      D.fx.rings.forEach(([x, y, z, s0, s1, dur, ph]) => {
        const m = model("cf_ring", { x, y, z, sx: s0, sy: 1, sz: s0 });
        anim(m, "sx", s0, s1, dur, { delay: ph }); anim(m, "sz", s0, s1, dur, { delay: ph });
        anim(m, "y", y, y - 0.08, dur, { delay: ph, easing: "easeInQuad" });
      });
    });
    // the courtyard fountain pours (curtains slide down inside the chocolate rolls on each rim)
    { const f = model("cf_fountain_flow"); anim(f, "y", 0, -D.fx.fountain_rep, 650, {}); }
    // the uphill river in the tunnel flows UP toward floor 2
    later(5200, () => { const f = model("cf_ramp_flow"); anim(f, "x", 0, D.fx.ramp_dx, 1400, {}); anim(f, "y", 0, D.fx.ramp_dy, 1400, {}); });
    // candy-coloured smoke from the seven stacks: each puff rises, swells and shrinks away, then starts again at the crown
    D.stacks.forEach(([x, y, z], i) => {
      const cols = ["pink", "mint", "lav", "cream"];
      for (let k = 0; k < 3; k++) {
        const dur = 9000 + (i % 3) * 800, ph = Math.round(k * dur / 3 + i * 410);
        const m = model("cf_smoke_" + cols[(i + k) % 4], { x, y, z });
        anim(m, "y", y + 0.5, y + 22, dur, { delay: ph, easing: "easeOutSine" });
        anim(m, "x", x, x + 6 + (i % 2) * 3, dur, { delay: ph });
        ["sx", "sy", "sz"].forEach((a) => anim(m, a, 0.5, 3.4, dur / 2, { delay: ph, pingPong: true, easing: "easeInOutSine" }));
      }
    });

    // ---------------------------------------------------------------- the courtyard gates (open by default)
    const GATE = { open: true };
    const gates = [["cf_gate_l", -L.GATE_HALF, 90], ["cf_gate_r", L.GATE_HALF, -90]].map(([f, x, ryOpen]) => {
      const g = el("m-group", { x, y: 0, z: L.CY_Z1, ry: ryOpen }); model(f, {}, g); g._open = ryOpen; return g;
    });
    const gatePad = [];
    function gatesSet(open) {
      if (GATE.open === open) return open ? "THE GATES ARE ALREADY OPEN" : "THE GATES ARE ALREADY SHUT";
      GATE.open = open;
      gates.forEach((g) => swing(g, "ry", open ? 0 : g._open, open ? g._open : 0, 5000));
      if (open) { gatePad.splice(0).forEach((p) => p.remove()); }
      else gatePad.push(pad({ x: 0, y: 3.5, z: L.CY_Z1, width: 2 * L.GATE_HALF, height: 7, depth: 0.4 }));
      return open ? "THE GATES ARE SWINGING OPEN" : "THE GATES ARE CLOSING";
    }
    // ---------------------------------------------------------------- the front doors (open by default)
    const FD = { open: true };
    const fdoors = [["cf_fdoor_l", -4, 92], ["cf_fdoor_r", 4, -92]].map(([f, x, ryOpen]) => {
      const g = el("m-group", { x, y: L.YH, z: L.PAVZ, ry: ryOpen }); model(f, {}, g); g._open = ryOpen; return g;
    });
    let fdPad = null;
    function frontSet(open) {
      if (FD.open === open) return open ? "THE FRONT DOORS ARE ALREADY OPEN" : "THE FRONT DOORS ARE ALREADY SHUT";
      FD.open = open;
      fdoors.forEach((g) => swing(g, "ry", open ? 0 : g._open, open ? g._open : 0, 3500));
      if (open) { if (fdPad) fdPad.remove(); fdPad = null; }
      else fdPad = pad({ x: 0, y: L.YH + 5, z: L.PAVZ - 0.5, width: 8, height: 10, depth: 0.5 });
      return open ? "THE FRONT DOORS ARE OPEN" : "THE FRONT DOORS ARE SHUT";
    }

    // ---------------------------------------------------------------- the coded doors (Oompa Loompas only)
    const CODES = D.codes.slice();
    const DOORS = [];
    D.doors.forEach((d, i) => {
      // d: [side (-1 west / 1 east), z, name, colour]
      const [side, z, name, col] = d;
      const x = side * L.HALL_W;
      const ry0 = side < 0 ? 90 : -90, ry1 = side < 0 ? 180 : 0;
      const hz = side < 0 ? z + L.DOOR_W / 2 - 0.02 : z - L.DOOR_W / 2 + 0.02;
      const g = el("m-group", { x, y: L.YH, z: hz, ry: ry0 });
      model("cf_door_" + col, {}, g);
      const block = pad({ x, y: L.YH + 1.7, z, width: 0.4, height: 3.4, depth: L.DOOR_W });
      // keypad on the wall beside the door: click it to type the code
      const kz = side < 0 ? z - 1.55 : z + 1.55;
      const pr = el("m-prompt", { x: x - side * 0.03, y: L.YH + 1.45, z: kz, ry: side < 0 ? 90 : -90, message: "STAFF ONLY - " + name + " - enter the door code", placeholder: "4-digit code" });
      model("cf_keypad", { collide: "true" }, pr);
      const door = { i, name, side, z, g, block, ry0, ry1, open: false, h: null, pr, led: null };
      pr.addEventListener("prompt", (e) => {
        const v = String((e.detail && e.detail.value) || "").replace(/\D/g, "");
        const ok = v === CODES[i];
        flash(door, ok);
        if (ok) doorOpen(door, DOOR_OPEN_MS);
      });
      DOORS.push(door);
    });
    function flash(door, ok) {
      if (door.led) door.led.remove();
      const led = model(ok ? "cf_led_green" : "cf_led_red", { x: 0.15, y: 0.26, z: 0.08 }, door.pr);
      door.led = led;
      later(ok ? 4000 : 2000, () => { if (door.led === led) { led.remove(); door.led = null; } });
    }
    function doorOpen(door, ms) {
      if (door.h) { _clrT(door.h); door.h = null; }
      if (!door.open) {
        door.open = true;
        swing(door.g, "ry", door.ry0, door.ry1, 1600);
        if (door.block) { door.block.remove(); door.block = null; }
      }
      if (ms) door.h = later(ms, () => doorClose(door));
    }
    function doorClose(door) {
      if (door.h) { _clrT(door.h); door.h = null; }
      if (!door.open) return;
      door.open = false;
      swing(door.g, "ry", door.ry1, door.ry0, 1600);
      door.block = pad({ x: door.side * L.HALL_W, y: L.YH + 1.7, z: door.z, width: 0.4, height: 3.4, depth: L.DOOR_W });
    }

    // ---------------------------------------------------------------- the grand chocolate doors (click to open)
    const MD = { open: false, hold: false, h: null };
    const mdoors = [["cf_mdoor_l", -L.MAIN_W / 2, 92], ["cf_mdoor_r", L.MAIN_W / 2, -92]].map(([f, x, ryOpen]) => {
      const g = el("m-group", { x, y: L.YH, z: L.HALL_Z0, ry: 0 }); model(f, { collide: "true" }, g); g._open = ryOpen; return g;
    });
    let mdPad = pad({ x: 0, y: L.YH + 2.8, z: L.HALL_Z0 - 0.15, width: L.MAIN_W, height: 5.6, depth: 0.3 });
    function mainOpen(ms) {
      if (MD.h) { _clrT(MD.h); MD.h = null; }
      if (!MD.open) {
        MD.open = true;
        mdoors.forEach((g) => swing(g, "ry", 0, g._open, 4200, "easeInOutQuad"));
        if (mdPad) { mdPad.remove(); mdPad = null; }
      }
      if (ms && !MD.hold) MD.h = later(ms, () => mainClose());
    }
    function mainClose() {
      if (MD.h) { _clrT(MD.h); MD.h = null; }
      if (!MD.open) return;
      MD.open = false;
      mdoors.forEach((g) => swing(g, "ry", g._open, 0, 3500, "easeInOutQuad"));
      later(3500, () => { if (!MD.open && !mdPad) mdPad = pad({ x: 0, y: L.YH + 2.8, z: L.HALL_Z0 - 0.15, width: L.MAIN_W, height: 5.6, depth: 0.3 }); });
    }
    mdoors.forEach((g) => g.addEventListener("click", () => mainOpen(MAIN_OPEN_MS)));

    // ---------------------------------------------------------------- THE BOATS: six candy boats, two lanes, three rows
    const BT = D.boats;
    const BOAT = { state: "bottom", boats: [], gen: 0, auto: true, t0: 0, until: 0, dur: 0 };
    BT.rows0.forEach((x0, r) => BT.lanes.forEach((z, l) => {
      const g = el("m-group", { x: x0, y: L.W0, z, rz: 0 });
      model("h_boat", { y: BT.model_y }, g);
      // the candy boat: raised benches fore and aft, a low well in the middle, tall sides
      const deck = pad({ y: BT.bench_y - 0.12, x: 2.3, width: 2.6, height: 0.24, depth: 3.4 }, g);
      const deck2 = pad({ y: BT.bench_y - 0.12, x: -2.3, width: 2.6, height: 0.24, depth: 3.4 }, g);
      const well = pad({ y: BT.well_y - 0.12, width: 2.2, height: 0.24, depth: 3.4 }, g);
      [-1, 1].forEach((sd) => pad({ y: BT.bench_y + 0.45, z: sd * 1.85, width: 7.0, height: 1.3, depth: 0.15 }, g));
      [-1, 1].forEach((sd) => pad({ x: sd * 3.65, y: BT.bench_y + 0.3, width: 0.15, height: 0.8, depth: 3.4 }, g));
      const b = { g, x0, x1: BT.rows1[r], z, anims: [], on: new Set() };
      const onE = (e) => { const id = e.detail && e.detail.connectionId; if (typeof id === "number") b.on.add(id); };
      [deck, deck2, well].forEach((p) => { p.addEventListener("collisionstart", onE); p.addEventListener("collisionmove", onE);
        p.addEventListener("collisionend", (e) => b.on.delete(e.detail && e.detail.connectionId)); });
      BOAT.boats.push(b);
    }));
    onWin("disconnected", (e) => { const id = e.detail && e.detail.connectionId; BOAT.boats.forEach((b) => b.on.delete(id)); });
    // the lane height and pitch at x (same curve the tunnel and the ramp river were modelled on)
    const slope = (L.W1 - L.W0) / (BT.ramp1 - BT.ramp0), pitchMax = Math.atan(slope) * 180 / Math.PI;
    function laneY(x) {
      const a = BT.ramp0, c = BT.ramp1;
      if (x <= a - 3) return L.W0; if (x >= c + 3) return L.W1;
      if (x < a + 3) { const u = x - (a - 3); return L.W0 + slope * u * u / 12; }
      if (x > c - 3) { const u = (c + 3) - x; return L.W1 - slope * u * u / 12; }
      return L.W0 + slope * (x - a);
    }
    function lanePitch(x) {
      const a = BT.ramp0, c = BT.ramp1;
      if (x <= a - 3 || x >= c + 3) return 0;
      if (x < a + 3) return pitchMax * (x - (a - 3)) / 6;
      if (x > c - 3) return pitchMax * ((c + 3) - x) / 6;
      return pitchMax;
    }
    // a trip = one list of [t (ms from departure), x, y, rz, easing] keyframes per boat; the same speed profile for every boat
    function plan(b, up) {
      const xa = up ? b.x0 : b.x1, xb = up ? b.x1 : b.x0, dir = Math.sign(xb - xa), dist = Math.abs(xb - xa);
      const ACC = 6, DEC = 5, v = BOAT_SPEED / 1000;
      const brk = [BT.ramp0 - 3, BT.ramp0 - 1, BT.ramp0 + 1, BT.ramp0 + 3, BT.ramp1 - 3, BT.ramp1 - 1, BT.ramp1 + 1, BT.ramp1 + 3];
      const ss = new Set([0, ACC, dist - DEC, dist]);
      brk.forEach((x) => { const s = (x - xa) * dir; if (s > ACC + 0.01 && s < dist - DEC - 0.01) ss.add(s); });
      const S = Array.from(ss).sort((p, q) => p - q);
      const kf = []; let t = 0;
      for (let i = 0; i < S.length; i++) {
        const s = S[i], x = xa + dir * s;
        if (i > 0) {
          const d = s - S[i - 1];
          const accel = S[i - 1] < ACC - 1e-6, decel = s > dist - DEC + 1e-6;
          t += accel || decel ? 2 * d / v : d / v;
          kf.push([Math.round(t), x, laneY(x), lanePitch(x), accel ? "easeInQuad" : decel ? "easeOutQuad" : ""]);
        } else kf.push([0, x, laneY(x), lanePitch(x), ""]);
      }
      return kf;
    }
    function boatSeg(b, k0, k1, tStart) {
      const ms = k1[0] - k0[0], t = Math.round(tStart + k0[0]);
      const add = (attr, a, c) => { if (Math.abs(a - c) < 1e-4) return null; return el("m-attr-anim", Object.assign({ attr, start: r3(a), end: r3(c), "start-time": t, duration: ms, loop: "false" }, k1[4] ? { easing: k1[4] } : {}), b.g); };
      const made = [add("x", k0[1], k1[1]), add("y", k0[2], k1[2]), add("rz", k0[3], k1[3])].filter(Boolean);
      const old = b.anims; b.anims = made;
      later(250, () => old.forEach((a) => a.remove()));            // the finished anims hold the boat until the new ones are in
    }
    function trip(up) {
      const gen = ++BOAT.gen;
      const tStart = Math.round(now()) + 200;
      BOAT.state = up ? "up" : "down"; BOAT.t0 = tStart;
      let longest = 0;
      BOAT.boats.forEach((b) => {
        const kf = plan(b, up);
        longest = Math.max(longest, kf[kf.length - 1][0]);
        kf.forEach((k, i) => { if (i === 0) return; later(tStart + kf[i - 1][0] - now() - 120, () => { if (gen === BOAT.gen) boatSeg(b, kf[i - 1], k, tStart); }); });
        later(tStart + kf[kf.length - 1][0] - now() + 80, () => {
          if (gen !== BOAT.gen) return;
          const e = kf[kf.length - 1];
          b.g.setAttribute("x", r3(e[1])); b.g.setAttribute("y", r3(e[2])); b.g.setAttribute("rz", 0);
          later(400, () => { if (gen === BOAT.gen) { b.anims.forEach((a) => a.remove()); b.anims = []; } });
        });
      });
      BOAT.dur = longest;
      later(tStart + longest - now() + 600, () => {
        if (gen !== BOAT.gen) return;
        BOAT.state = up ? "top" : "bottom"; BOAT.until = now() + (up ? BOAT_TOP_MS : BOAT_BOARD_MS);
        hostMsg(up ? "THE BOATS HAVE REACHED FLOOR 2" : "THE BOATS ARE BACK AT THE LAGOON");
        if (BOAT.auto) later(up ? BOAT_TOP_MS : BOAT_BOARD_MS, () => { if (gen === BOAT.gen && BOAT.auto) trip(!up); });
      });
      return (up ? "THE BOATS ARE OFF INTO THE DARK TUNNEL - FLOOR 2 IN " : "THE BOATS ARE HEADING BACK DOWN - LAGOON IN ") + Math.round(longest / 1000) + " S";
    }
    function boatsReset() {
      BOAT.gen++;
      BOAT.boats.forEach((b) => { b.anims.forEach((a) => a.remove()); b.anims = []; b.g.setAttribute("x", b.x0); b.g.setAttribute("y", L.W0); b.g.setAttribute("rz", 0); });
      BOAT.state = "bottom"; BOAT.until = now() + BOAT_BOARD_MS;
      if (BOAT.auto) { const gen = BOAT.gen; later(BOAT_BOARD_MS, () => { if (gen === BOAT.gen && BOAT.auto) trip(true); }); }
      return "ALL SIX BOATS ARE BACK AT THE LAGOON";
    }
    // auto mode starts with boarding time at the lagoon
    { const gen = BOAT.gen; BOAT.until = now() + BOAT_BOARD_MS; later(BOAT_BOARD_MS, () => { if (gen === BOAT.gen && BOAT.auto && BOAT.state === "bottom") trip(true); }); }

    // ---------------------------------------------------------------- host commands + remote status
    function command(cmd, a) {
      const v = (a[0] || "").toLowerCase();
      if (cmd === "gates") return v === "close" || v === "shut" ? gatesSet(false) : gatesSet(true);
      if (cmd === "doors" || cmd === "front") return v === "close" || v === "shut" ? frontSet(false) : frontSet(true);
      if (cmd === "main") {
        if (v === "hold") { MD.hold = true; mainOpen(0); return "THE CHOCOLATE DOORS ARE OPEN AND STAY OPEN"; }
        if (v === "close" || v === "shut") { MD.hold = false; mainClose(); return "THE CHOCOLATE DOORS ARE CLOSING"; }
        MD.hold = false; mainOpen(MAIN_OPEN_MS); return "THE CHOCOLATE DOORS ARE OPENING (" + MAIN_OPEN_MS / 1000 + " S)";
      }
      if (cmd === "door") {                        // door <1-10|all> open|close
        const which = v === "all" ? DOORS : [DOORS[(+a[0] || 0) - 1]].filter(Boolean);
        if (!which.length) return "DOOR NUMBER 1-10 OR ALL";
        const how = (a[1] || "open").toLowerCase();
        which.forEach((d) => how === "close" ? doorClose(d) : doorOpen(d, how === "hold" ? 0 : DOOR_OPEN_MS));
        return which.length + " DOOR(S) " + (how === "close" ? "CLOSING" : "OPEN");
      }
      if (cmd === "code") {                        // code <1-10> <4 digits>
        const i = (+a[0] || 0) - 1, c = String(a[1] || "").replace(/\D/g, "");
        if (!DOORS[i] || c.length < 3) return "USE: CODE <1-10> <DIGITS>";
        CODES[i] = c; return "DOOR " + (i + 1) + " (" + DOORS[i].name + ") CODE IS NOW " + c;
      }
      if (cmd === "codes") return DOORS.map((d, i) => (i + 1) + " " + d.name + ": " + CODES[i]).join(" | ");
      if (cmd === "boats") {
        if (v === "go" || v === "up") { if (BOAT.state !== "bottom") return "THE BOATS AREN'T AT THE LAGOON (" + BOAT.state.toUpperCase() + ")"; return trip(true); }
        if (v === "down" || v === "back") { if (BOAT.state !== "top") return "THE BOATS AREN'T AT FLOOR 2 (" + BOAT.state.toUpperCase() + ")"; return trip(false); }
        if (v === "reset") return boatsReset();
        if (v === "auto") { BOAT.auto = (a[1] || "on").toLowerCase() !== "off"; if (BOAT.auto && (BOAT.state === "bottom" || BOAT.state === "top")) { const gen = ++BOAT.gen; const up = BOAT.state === "bottom"; later(5000, () => { if (gen === BOAT.gen && BOAT.auto) trip(up); }); } return "BOAT AUTO " + (BOAT.auto ? "ON" : "OFF"); }
        return "BOATS: " + BOAT.state.toUpperCase() + " - " + BOAT.boats.reduce((n, b) => n + b.on.size, 0) + " ABOARD - AUTO " + (BOAT.auto ? "ON" : "OFF");
      }
      return null;
    }
    function game() {
      const tn = now();
      return { ph: "built", gates: GATE.open, front: FD.open, main: MD.open, mainHold: MD.hold,
               doors: DOORS.map((d, i) => ({ n: i + 1, name: d.name, open: d.open, code: CODES[i] })),
               boats: { state: BOAT.state, auto: BOAT.auto, aboard: BOAT.boats.map((b) => b.on.size),
                        secs: BOAT.state === "up" || BOAT.state === "down" ? Math.round((tn - BOAT.t0) / 1000) + "/" + Math.round(BOAT.dur / 1000) : Math.max(0, Math.round((BOAT.until - tn) / 1000)) } };
    }
    return { command, game };
  }
})();
</script>
