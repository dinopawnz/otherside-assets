  const DECOR = /cf_smoke|cf2_fx_ripple|cf2_a_(float_bubble|balloon|bubbles)|h_(choc_flower|candy_flower|sweets|candy_pumpkin|rock_candy|gummy|icecream|macarons|truffles|donut|choc_rock|mint_lamp|choc_bench|lamp)/;
  function liteOn() {
    if (LITE) return "LITE MODE IS ALREADY ON";
    const out = Array.from(WORLD.querySelectorAll("m-model, m-image, m-group[data-lite]")).filter((m) => DECOR.test(m.getAttribute("src") || "") || m.hasAttribute("data-lite"));
    LITE = { removed: out.map((n) => ({ n, parent: n.parentNode, next: n.nextSibling })) };
    LITE.removed.forEach((r) => r.n.remove());
    return "LITE MODE ON - " + LITE.removed.length + " DECORATION PIECES REMOVED";
  }
  function liteOff() {
    if (!LITE) return "LITE MODE IS ALREADY OFF";
    LITE.removed.slice().reverse().forEach((r) => { if (r.next && r.next.parentNode === r.parent) r.parent.insertBefore(r.n, r.next); else r.parent.appendChild(r.n); });
    const n = LITE.removed.length; LITE = null;
    return "LITE MODE OFF - " + n + " PIECES ARE BACK";
  }
  function refreshAll() {
    if (!WORLD) return "NOT BUILT";
    const kids = Array.from(WORLD.children);
    kids.forEach((g) => { g.remove(); WORLD.appendChild(g); });
    try { GAME && GAME.refresh(); } catch (e) {}
    return "REFRESHED - " + kids.length + " PARTS RE-SENT. DOORS, ELEVATOR, BOATS AND CODES KEPT.";
  }
  function build() {
    if (GAME) return "ALREADY BUILT";
    WORLD = el("m-group", { z: -FRONT }, rootGroup);
    ROOT = WORLD;
    placer.setAttribute("y", PARK);
    try { GAME = buildWorld(); } catch (e) { hostMsg("BUILD ERROR: " + (e && e.message)); }
    builtAt = now();
    return "LIVE BUILD ON - THE CHOCOLATE FACTORY IS UP";
  }
  function unbuild() {
    if (!WORLD) return "ALREADY FOLDED";
    LITE = null;
    TIMERS.forEach((h) => _clrT(h)); TIMERS.clear();
    INTERVALS.forEach((h) => _clrI(h)); INTERVALS.clear();
    LISTENERS.forEach(([ev, f]) => window.removeEventListener(ev, f)); LISTENERS.length = 0;
    WORLD.remove(); WORLD = null; GAME = null; ROOT = rootGroup;
    placer.setAttribute("y", 0);
    return "LIVE BUILD OFF - BACK TO THE PLACER";
  }
  hostPrompt.addEventListener("prompt", (e) => {
    const raw = String((e && e.detail && e.detail.value) || "").replace(/\s+/g, " ").trim();
    if (raw.indexOf(HOST_CODE) !== 0) { hostMsg("WRONG CODE"); return; }
    const rest = raw.slice(HOST_CODE.length).trim();
    const parts = rest.split(" ").filter(Boolean);
    const cmd = (parts[0] || "").toLowerCase();
    const id = e.detail.connectionId;
    if (cmd === "remote") {
      if (id === undefined) { hostMsg("REMOTE: NO CONNECTION ID"); return; }
      REMOTES.add(id); ONLINE.delete(id); remoteBoard.setAttribute("visible-to", Array.from(REMOTES).join(" "));
      hostMsg("UNLOCKED"); paintRemote(); return;
    }
    if (cmd === "build") { hostMsg(build()); return; }
    if (cmd === "unbuild") { hostMsg(unbuild()); return; }
    if (!GAME) { hostMsg("NOT BUILT YET - PRESS LIVE BUILD FIRST"); return; }
    if (cmd === "lite") { const a = (parts[1] || "").toLowerCase(); hostMsg(a === "off" ? liteOff() : a === "on" ? liteOn() : LITE ? liteOff() : liteOn()); return; }
    if (cmd === "refresh") { hostMsg(refreshAll()); return; }
    let reply = null;
    try { reply = GAME.command(cmd, parts.slice(1)); } catch (err) { reply = "ERROR: " + (err && err.message); }
    hostMsg(reply || "UNKNOWN: " + cmd);
  });
  window.addEventListener("connected", (e) => { if (e.detail && !REMOTES.has(e.detail.connectionId)) ONLINE.add(e.detail.connectionId); });
  window.addEventListener("disconnected", (e) => {
    const c = e.detail.connectionId;
    ONLINE.delete(c);
    if (REMOTES.delete(c)) remoteBoard.setAttribute("visible-to", REMOTES.size ? Array.from(REMOTES).join(" ") : "-1");
  });
  if (AUTO_BUILD_MS > 0) _setT(() => { if (!GAME) hostMsg(build()); }, AUTO_BUILD_MS);

  // ==========================================================
  // THE WORLD
  // ==========================================================
  function buildWorld() {
    const nameOf = (id) => NAMES.get(id) || ("Player #" + id);
    // ---------------------------------------------------------------- 1. solid things first: colliders (plain .glb) + backup pads
    D.col.forEach((f) => collider(f));
    // backup floors made of invisible boxes (if a collision model ever fails to load, the floors are still there)
    D.pads.forEach(([x, y, z, w, h, d, rx, ry, rz]) => pad({ x, y, z, width: w, height: h, depth: d, rx: rx || 0, ry: ry || 0, rz: rz || 0 }));
    // ---------------------------------------------------------------- 2. the building, staged so the outside appears first
    const stage = (k) => D.stat.filter((s) => s[1] === k).forEach((s) => model(s[0], s[2] ? { "cast-shadows": "true" } : {}));
    const hero = ([n, x, y, z, ry, sx, sy, sz]) => model("h_" + n, { x, y, z, ry, sx, sy, sz });
    stage(0); D.dress.court.forEach(hero);
    later(2500, () => { stage(1); D.dress.room.forEach(hero); });
    later(5000, () => { stage(2); D.dress.up.forEach(hero); });
    later(7000, () => { stage(3); });

    // ---------------------------------------------------------------- 3. everything that moves on its own (machines, gears, belts, bubbles)
    function placeAnim(e) {
      const ry = el("m-group", { x: e.p[0], y: e.p[1], z: e.p[2], ry: e.r[1] });
      const rx = e.r[0] ? el("m-group", { rx: e.r[0] }, ry) : ry;
      const rz = e.r[2] ? el("m-group", { rz: e.r[2] }, rx) : rx;
      const m = model("cf2_a_" + e.m, e.s !== 1 ? { sx: e.s, sy: e.s, sz: e.s } : {}, rz);
      e.a.forEach(([attr, a, b, ms, pp, easing, delay]) => anim(m, attr, a, b, ms, { pingPong: !!pp, easing: easing || undefined, delay: delay || 0 }));
      return m;
    }
    later(3000, () => D.anims.forEach(placeAnim));
    // the candy crew: every worker is the orange green-haired crew model (cf2_crew_orange, one piece with its arms).
    // walkers stroll a loop with a waddle; carriers hold a crate / tray in front; the rest bob and sway at their jobs
    const CREW = "cf2_crew_orange";
    const WORK = { stir: ["rx", -3, 4, 1400], chop: ["rx", 0, 6, 700], hammer: ["rx", 0, 7, 650], carry: ["rx", 0, 4, 900],
                   wave: ["rz", -7, 7, 600], chat: ["rz", -3, 3, 1500], talk: ["rz", -4, 4, 900] };
    function worker([v, x, y, z, ry, pose, tool, R, ms], i) {
      if (pose === "walk" || pose === "walkc") {
        const g = el("m-group", { x, y, z, "data-lite": "1" });
        const dir = ry < 0 ? -1 : 1;
        const loop = el("m-group", {}, g);
        anim(loop, "ry", 0, 360 * dir, ms, { delay: (i * 977) % ms });
        const hold = el("m-group", { x: R, ry: dir > 0 ? 180 : 0 }, loop);
        const bob = el("m-group", {}, hold);
        const step = pose === "walk" ? 430 : 520;
        anim(bob, "y", 0, 0.06, step / 2, { pingPong: true, easing: "easeInOutSine" });
        anim(bob, "rz", -5, 5, step, { pingPong: true, easing: "easeInOutSine" });
        model(CREW, {}, bob);
        if (pose === "walkc") model("cf2_w_" + (tool || "crate"), { y: tool === "tray" ? 0.88 : 0.66, z: 0.46, sx: 0.9, sy: 0.9, sz: 0.9 }, bob);
        return;
      }
      const g = el("m-group", { x, y, z, ry });
      const bob = el("m-group", {}, g);
      anim(bob, "y", 0, 0.05, 520 + (i % 5) * 40, { pingPong: true, easing: "easeInOutSine", delay: i * 97 });
      const W = WORK[pose] || WORK.carry;
      const sway = el("m-group", {}, bob);
      anim(sway, W[0], W[1], W[2], W[3] + (i % 4) * 60, { pingPong: true, easing: "easeInOutSine", delay: i * 131 });
      if (pose === "chat" || pose === "talk") anim(g, "ry", ry - 10, ry + 10, 2600 + (i % 3) * 300, { pingPong: true, easing: "easeInOutSine", delay: i * 53 });
      model(CREW, {}, sway);
    }
    later(3500, () => D.workers.forEach(worker));
    // candy-coloured smoke from the seven stacks (two puffs each)
    D.stacks.forEach(([x, y, z], i) => {
      const cols = ["pink", "mint", "lav", "cream"];
      for (let k = 0; k < 2; k++) {
        const dur = 9000 + (i % 3) * 800, ph = Math.round(k * dur / 2 + i * 410);
        const m = model("cf_smoke_" + cols[(i + k) % 4], { x, y, z });
        anim(m, "y", y + 0.5, y + 22, dur, { delay: ph, easing: "easeOutSine" });
        ["sx", "sy", "sz"].forEach((a) => anim(m, a, 0.6, 3.4, dur, { delay: ph, easing: "easeOutSine" }));
      }
    });

    // ---------------------------------------------------------------- 4. THE COURTYARD FOUNTAIN pours (the castle fountains' way):
    // a glossy curtain of chocolate over every rim, rings of drops racing down from each rim (easeInQuad = gravity) and spreading out
    // as they fall, ripples spreading across each bowl, and a bubbling crown at the top
    {
      const F = D.fount, g = el("m-group", { x: F.x, z: F.z });
      model("cf2_fx_curtains", {}, g);
      F.tiers.forEach(([r0, y0, r1, y1, ms], t) => {
        for (let ph = 0; ph < 3; ph++) {
          const d = model("cf2_fx_drops", { y: y0, sx: r0, sz: r0 }, g);
          const o = { delay: (ms * ph) / 3 + t * 110, easing: "easeInQuad" };
          anim(d, "y", y0, y1, ms, o); anim(d, "sx", r0, r1, ms, o); anim(d, "sz", r0, r1, ms, o);
        }
        const rIn = t === 0 ? 7.6 : F.tiers[t - 1][0] - 0.5, rOut = t === 0 ? 8.1 : F.tiers[t - 1][0] - 0.2;
        for (let ph = 0; ph < 2; ph++) {
          const r = model("cf2_fx_ripple", { y: y1 + 0.03, sx: r1, sz: r1 }, g);
          const o = { delay: ph * 1300 + t * 400, easing: "easeOutQuad" };
          anim(r, "sx", r1, rOut, 2600, o); anim(r, "sz", r1, rOut, 2600, o);
        }
      });
      const cr = model("cf2_fx_crown", { y: F.crown[1] }, g);
      ["sx", "sz"].forEach((a) => anim(cr, a, 0.85, 1.25, 700, { pingPong: true, easing: "easeInOutSine" }));
      anim(cr, "sy", 1.2, 0.8, 700, { pingPong: true, easing: "easeInOutSine" });
    }

    // ---------------------------------------------------------------- 5. THE CHOCOLATE WATERFALL (the Spire's falls, in chocolate):
    // a solid sheet, and four streaky sheets sliding down over it while fading in and out a quarter-cycle apart, so it pours without a seam
    {
      const W = D.falls;
      model("cf2_fx_fallbase", {});
      const fg = el("m-group", { x: W.x, z: W.z + 0.45 });
      const h = W.top + 0.3, cy = W.top / 2, P = 3.0;
      for (let k = 0; k < 4; k++) {
        const dur = 1300 + (k % 2) * 170, op = 0.85 - 0.08 * k;
        const m = el("m-image", { src: img("choc_fall.png"), x: (k - 1.5) * 0.1, y: cy, z: 0.05 + k * 0.03, width: W.w - (k % 2) * 0.5, height: h + P, emissive: 0.4, opacity: op, collide: "false", "cast-shadows": "false" }, fg);
        anim(m, "y", cy + P / 2, cy - P / 2, dur, { delay: (dur * k) / 4 });
        anim(m, "opacity", 0.0, op, dur / 2, { pingPong: true, easing: "easeInOutSine", delay: (dur * k) / 4 });
      }
      // churning foam where it lands + rings spreading over the plunge pool
      for (let k = 0; k < 2; k++) {
        const g = el("m-group", { x: W.x, y: L.W0 + 0.04 + k * 0.02, z: W.z + 3.0, sx: 1.4, sz: 1.6 });
        const foam = el("m-image", { src: img("choc_foam.png"), rx: -90, width: W.w + 1.5, height: 3.0, emissive: 0.5, opacity: 0.85, collide: "false", "cast-shadows": "false", "data-lite": "1" }, g);
        anim(g, "ry", k ? 8 : -8, k ? -8 : 8, 2600 + k * 700, { pingPong: true, easing: "easeInOutSine" });
        anim(foam, "opacity", 0.5, 0.9, 900 + k * 300, { pingPong: true, easing: "easeInOutSine" });
      }
      for (let k = 0; k < 3; k++) {
        const r = model("cf2_fx_ripple", { x: W.x, y: L.W0 + 0.03, z: W.z + 5.0 });
        const o = { delay: k * 1000, easing: "easeOutQuad" };
        anim(r, "sx", 1.0, 6.0, 3000, o); anim(r, "sz", 1.0, 6.0, 3000, o);
      }
    }
    // ---------------------------------------------------------------- 6. THE RIVER FLOWS (the Spire's falls laid flat): the river is cut into
    // sections; in each, two streaky sheets lie on the chocolate and glide downstream one section-step per loop while fading in and out
    // half a cycle apart - every section in the same rhythm, so the whole river slides along without a seam
    {
      const RV = D.river, P = RV.P;
      RV.sec.forEach(([x, z, ry, len], i) => {
        const g = el("m-group", { x, y: L.W0 + 0.025 + (i % 2) * 0.006, z, ry });
        for (let k = 0; k < 2; k++) {
          const dur = RV.ms, op = 0.62;
          const m = el("m-image", { src: img("choc_flow.png"), rx: -90, y: k * 0.004, width: RV.w, height: len + P, emissive: 0.15, opacity: op, collide: "false", "cast-shadows": "false" }, g);
          anim(m, "z", -P / 2, P / 2, dur, { delay: (dur * k) / 2 });
          anim(m, "opacity", 0.0, op, dur / 2, { pingPong: true, easing: "easeInOutSine", delay: (dur * k) / 2 });
        }
      });
    }
    // the uphill river in the tunnel flows UP toward floor 2 (v1)
    later(5200, () => { const f = model("cf_ramp_flow"); anim(f, "x", 0, D.rampFlow[0], 1400, {}); anim(f, "y", 0, D.rampFlow[1], 1400, {}); });
    // the glass pipes gulp chocolate up out of the river
    D.pipes.forEach(([x, y, z, r, h], i) => {
      const m = model("cf2_fx_pipeblobs", { x, y, z, sx: r / 0.85, sz: r / 0.85 });
      anim(m, "y", y - 1.4, y, 900 + i * 90, {});
    });
    // the caramel kitchen's caramel fall
    (D.fallsSmall || []).forEach(([x, top, z, w, bot], i) => {
      const g = el("m-group", { x, z }); const h = top - bot, cy = bot + h / 2, P = 1.2;
      for (let k = 0; k < 2; k++) {
        const m = el("m-image", { src: img("choc_fall.png"), y: cy, z: 0.02 * k, width: w, height: h + P, emissive: 0.6, opacity: 0.9, collide: "false", "cast-shadows": "false" }, g);
        anim(m, "y", cy + P / 2, cy - P / 2, 900, { delay: 450 * k }); anim(m, "opacity", 0.2, 0.9, 450, { pingPong: true, easing: "easeInOutSine", delay: 450 * k });
      }
    });

    // ---------------------------------------------------------------- signs (words are pictures)
    D.signs.forEach(([k, x, y, z, ry, h]) => { word(k, h, { x, y, z, ry }); });

    // ---------------------------------------------------------------- the courtyard gates (open by default)
    const GATE = { open: true };
    const gates = [["cf_gate_l", -L.GATE_HALF, 90], ["cf_gate_r", L.GATE_HALF, -90]].map(([f, x, ryOpen]) => {
      const g = el("m-group", { x, y: 0, z: L.CY_Z1, ry: ryOpen }); model(f, {}, g); g._open = ryOpen; return g;
    });
    const gatePad = [];
    function gatesSet(open) {
      if (GATE.open === open) return open ? "THE GATES ARE ALREADY OPEN" : "THE GATES ARE ALREADY SHUT";
      GATE.open = open;
      gates.forEach((g) => swing(g, "ry", open ? 0 : g._open, open ? g._open : 0, 5000));
      if (open) { gatePad.splice(0).forEach((p) => p.remove()); }
      else gatePad.push(pad({ x: 0, y: 3.5, z: L.CY_Z1, width: 2 * L.GATE_HALF, height: 7, depth: 0.4 }));
      return open ? "THE GATES ARE SWINGING OPEN" : "THE GATES ARE CLOSING";
    }
    // ---------------------------------------------------------------- the front doors (open by default)
    const FD = { open: true };
    const fdoors = [["cf_fdoor_l", -4, 92], ["cf_fdoor_r", 4, -92]].map(([f, x, ryOpen]) => {
      const g = el("m-group", { x, y: L.YH, z: L.PAVZ, ry: ryOpen }); model(f, {}, g); g._open = ryOpen; return g;
    });
    let fdPad = null;
    function frontSet(open) {
      if (FD.open === open) return open ? "THE FRONT DOORS ARE ALREADY OPEN" : "THE FRONT DOORS ARE ALREADY SHUT";
      FD.open = open;
      fdoors.forEach((g) => swing(g, "ry", open ? 0 : g._open, open ? g._open : 0, 3500));
      if (open) { if (fdPad) fdPad.remove(); fdPad = null; }
      else fdPad = pad({ x: 0, y: L.YH + 5, z: L.PAVZ - 0.5, width: 8, height: 10, depth: 0.5 });
      return open ? "THE FRONT DOORS ARE OPEN" : "THE FRONT DOORS ARE SHUT";
    }

    // ---------------------------------------------------------------- the coded STAFF ONLY doors (four workshops off the hall)
    const CODES = D.codes.slice();
    const DOORS = [];
    D.doors.forEach((d, i) => {
      const [side, z, name, col] = d;
      const x = side * L.HALL_X;
      const ry0 = side < 0 ? 90 : -90, ry1 = side < 0 ? 180 : 0;
      const hz = side < 0 ? z + L.DOOR_W / 2 - 0.02 : z - L.DOOR_W / 2 + 0.02;
      const g = el("m-group", { x, y: L.YH, z: hz, ry: ry0 });
      model("cf_door_" + col, {}, g);
      const block = pad({ x, y: L.YH + 1.7, z, width: 0.5, height: 3.4, depth: L.DOOR_W });
      const kz = side < 0 ? z - 1.55 : z + 1.55;
      const pr = el("m-prompt", { x: x - side * 0.22, y: L.YH + 1.45, z: kz, ry: side < 0 ? 90 : -90, message: "STAFF ONLY - " + name + " - enter the door code", placeholder: "4-digit code" });
      model("cf_keypad", { collide: "true" }, pr);
      const door = { i, name, side, z, g, block, ry0, ry1, open: false, h: null, pr, led: null };
      pr.addEventListener("prompt", (e) => {
        const v = String((e.detail && e.detail.value) || "").replace(/\D/g, "");
        const ok = v === CODES[i];
        flash(door, ok);
        if (ok) doorOpen(door, DOOR_OPEN_MS);
      });
      DOORS.push(door);
    });
    function flash(door, ok) {
      if (door.led) door.led.remove();
      const led = model(ok ? "cf_led_green" : "cf_led_red", { x: 0.15, y: 0.26, z: 0.08 }, door.pr);
      door.led = led;
      later(ok ? 4000 : 2000, () => { if (door.led === led) { led.remove(); door.led = null; } });
    }
    function doorOpen(door, ms) {
      if (door.h) { cancel(door.h); door.h = null; }
      if (!door.open) {
        door.open = true;
        swing(door.g, "ry", door.ry0, door.ry1, 1600);
        if (door.block) { door.block.remove(); door.block = null; }
      }
      if (ms) door.h = later(ms, () => doorClose(door));
    }
    function doorClose(door) {
      if (door.h) { cancel(door.h); door.h = null; }
      if (!door.open) return;
      door.open = false;
      swing(door.g, "ry", door.ry1, door.ry0, 1600);
      door.block = pad({ x: door.side * L.HALL_X, y: L.YH + 1.7, z: door.z, width: 0.5, height: 3.4, depth: L.DOOR_W });
    }

    // ---------------------------------------------------------------- the grand chocolate doors (click to open)
    const MD = { open: false, hold: false, h: null };
    const mdoors = [["cf_mdoor_l", -L.MAIN_W / 2, 92], ["cf_mdoor_r", L.MAIN_W / 2, -92]].map(([f, x, ryOpen]) => {
      const g = el("m-group", { x, y: L.YH, z: L.MAIN_Z, ry: 0 }); model(f, { collide: "true" }, g); g._open = ryOpen; return g;
    });
    let mdPad = pad({ x: 0, y: L.YH + 2.8, z: L.MAIN_Z + 0.15, width: L.MAIN_W, height: 5.6, depth: 0.3 });
    function mainOpen(ms) {
      if (MD.h) { cancel(MD.h); MD.h = null; }
      if (!MD.open) {
        MD.open = true;
        mdoors.forEach((g) => swing(g, "ry", 0, g._open, 4200, "easeInOutQuad"));
        if (mdPad) { mdPad.remove(); mdPad = null; }
      }
      if (ms && !MD.hold) MD.h = later(ms, () => mainClose());
    }
    function mainClose() {
      if (MD.h) { cancel(MD.h); MD.h = null; }
      if (!MD.open) return;
      MD.open = false;
      mdoors.forEach((g) => swing(g, "ry", g._open, 0, 3500, "easeInOutQuad"));
      later(3500, () => { if (!MD.open && !mdPad) mdPad = pad({ x: 0, y: L.YH + 2.8, z: L.MAIN_Z + 0.15, width: L.MAIN_W, height: 5.6, depth: 0.3 }); });
    }
    mdoors.forEach((g) => g.addEventListener("click", () => mainOpen(MAIN_OPEN_MS)));
    MD.hold = true; mainOpen(0);                     // the chocolate doors start open (host can close them)

    // ---------------------------------------------------------------- THE BOATS (unchanged): six candy boats up the dark tunnel to floor 2
    const BT = D.boats;
    const BOAT = { state: "bottom", boats: [], gen: 0, auto: true, t0: 0, until: 0, dur: 0 };
    BT.rows0.forEach((x0, r) => BT.lanes.forEach((z, l) => {
      const g = el("m-group", { x: x0, y: L.W0, z, rz: 0 });
      model("h_boat", { y: BT.model_y }, g);
      const deck = pad({ y: BT.bench_y - 0.12, x: 2.3, width: 2.6, height: 0.24, depth: 3.4 }, g);
      const deck2 = pad({ y: BT.bench_y - 0.12, x: -2.3, width: 2.6, height: 0.24, depth: 3.4 }, g);
      const well = pad({ y: BT.well_y - 0.12, width: 2.2, height: 0.24, depth: 3.4 }, g);
      [-1, 1].forEach((sd) => pad({ y: BT.bench_y + 0.45, z: sd * 1.85, width: 7.0, height: 1.3, depth: 0.15 }, g));
      [-1, 1].forEach((sd) => pad({ x: sd * 3.65, y: BT.bench_y + 0.3, width: 0.15, height: 0.8, depth: 3.4 }, g));

            if (gen !== FIZZ.gen) return;
            fizzFan(false); FIZZ.ph = "down"; FIZZ.until = now() + 15000;
            FIZZ.bubs.filter((b) => !b.popped).forEach((b) => b.gy(FZ.y0, 15000, "easeInOutSine"));
            later(15400, () => { if (gen !== FIZZ.gen) return; FIZZ.bubs.forEach(bubHome); FIZZ.ph = "idle"; if (fizzWords) { fizzWords.remove(); fizzWords = null; } });
          });
        });
      });
      return "FIZZY FLOAT-OFF: BOARDING - EVERYONE HOP ON A BUBBLE (" + Math.round(FIZZ_BOARD_MS / 1000) + " S)";
    }
    function fizzReset() { FIZZ.gen++; fizzFan(false); FIZZ.bubs.forEach(bubHome); FIZZ.ph = "idle"; FIZZ.free = false; if (fizzWords) { fizzWords.remove(); fizzWords = null; } return "FIZZY BUBBLES RESET - ALL 16 BACK ON THE SODA"; }
    later(4000, () => fizzFree(true));

    // ==================================================================== GOLDEN TICKET RUSH (Wrapping Room, floor 2)
    // Six belts of wrapped bars glide past. Click a bar to unwrap it: only YOU see what was inside. Every player has their own hidden
    // golden tickets each round (about 1 bar in 11), so nobody can copy anyone. Most tickets when the timer runs out wins.
    const GT = D.gtr;
    const GTR = { ph: "idle", gen: 0, t0: 0, until: 0, score: new Map(), gold: new Map(), opened: new Map(), lock: new Map(), round: 0, last: [] };
    const BARS = [];
    const gtrBoard = el("m-group", { x: 0, y: GT.boardY, z: GT.boardZ, ry: 180 });
    word("gtr", 1.3, { y: 4.6, z: 0.1 }, gtrBoard);
    const lbl = el("m-label", { y: 0, z: 0.1, width: 16, height: 7.2, content: "CLICK A BAR TO UNWRAP IT!", "font-size": 64, alignment: "center", color: "#2a0c1e", "font-color": "#ffe9a8", emissive: 0.6, collide: "false" }, gtrBoard);
    const clock = el("m-group", { y: 5.9, z: 0.1 }, gtrBoard); let clockN = null;
    const colors = ["purple", "red", "teal", "orange"];
    later(3200, () => {
      GT.belts.forEach(([x0, x1, z, y, dir], bi) => {
        const n = Math.floor((x1 - x0) / GT.P);
        for (let i = 0; i < n; i++) {
          const x = x0 + GT.P * (i + 0.5);
          const g = el("m-group", { x, y, z });
          const m = model("cf2_bar_" + colors[(i + bi) % 4], { ry: ((i * 37) % 13) - 6 }, g);
          anim(m, "x", dir < 0 ? GT.P / 2 : -GT.P / 2, dir < 0 ? -GT.P / 2 : GT.P / 2, GT.ms, {});
          const hb = hitBox({ y: 0.25, width: 1.6, height: 0.6, depth: 0.9 }, g);
          const id = BARS.length; BARS.push({ g, x, y, z });
          hb.addEventListener("click", (e) => gtrClick(id, e.detail && e.detail.connectionId));
        }
      });
    });
    function card(kind, b, pid) {
      const c = el("m-group", { x: b.x, y: b.y + 1.6, z: b.z, "visible-to": String(pid) });
      el("m-image", { src: img("c_" + kind + ".png"), width: 1.6, height: 1.0, emissive: 1.0, collide: "false" }, c);
      el("m-image", { src: img("c_" + kind + ".png"), width: 1.6, height: 1.0, ry: 180, emissive: 1.0, collide: "false" }, c);
      later(2200, () => c.remove());
    }
    function gtrClick(bid, pid) {
      if (pid === undefined) return;
      const t = now(); if ((GTR.lock.get(pid) || 0) > t) return;
      GTR.lock.set(pid, t + GTR_LOCK_MS);
      const b = BARS[bid];
      if (GTR.ph !== "run") { card(Math.random() < 0.04 ? "golden" : "plain", b, pid); return; }
      let op = GTR.opened.get(pid); if (!op) { op = new Set(); GTR.opened.set(pid, op); }
      if (op.has(bid)) return; op.add(bid);
      let gs = GTR.gold.get(pid);
      if (!gs) { gs = new Set(); BARS.forEach((_, i) => { if (Math.random() < GTR_GOLD) gs.add(i); }); GTR.gold.set(pid, gs); }
      const win = gs.has(bid);
      card(win ? "golden" : "plain", b, pid);
      if (win) { GTR.score.set(pid, (GTR.score.get(pid) || 0) + 1); gtrPaint(); }
    }
    function gtrTop() { return Array.from(GTR.score.entries()).sort((a, b) => b[1] - a[1]).slice(0, 10); }
    function gtrPaint(title) {
      const top = gtrTop();
      lbl.setAttribute("content", (title || (GTR.ph === "run" ? "GOLDEN TICKETS FOUND" : "LAST ROUND")) + "\n" + (top.length ? top.map(([id, n], i) => (i + 1) + ". " + nameOf(id) + "  -  " + n).join("\n") : "nobody yet - get unwrapping!"));
    }
    function gtrClock() {
      if (clockN) clockN.remove(); clockN = null;
      if (GTR.ph !== "run") return;
      clockN = digits(Math.max(0, Math.ceil((GTR.until - now()) / 1000)), 1.0, {}, clock);
    }
    function gtrStart(secs) {
      if (GTR.ph === "run" || GTR.ph === "ready") return "GOLDEN TICKET RUSH IS ALREADY ON";
      const ms = (secs > 0 ? secs : GTR_MS / 1000) * 1000;
      const gen = ++GTR.gen; GTR.ph = "ready"; GTR.score = new Map(); GTR.gold = new Map(); GTR.opened = new Map(); GTR.round++;
      lbl.setAttribute("content", "GET READY...\nclick the bars on the belts\nto unwrap them - find\nGOLDEN TICKETS!");
      later(5000, () => {
        if (gen !== GTR.gen) return;
        GTR.ph = "run"; GTR.t0 = now(); GTR.until = now() + ms; gtrPaint();
        const tick = () => { if (gen !== GTR.gen || GTR.ph !== "run") return; gtrClock(); if (now() >= GTR.until) return gtrEnd(); later(1000, tick); };
        tick();
      });
      return "GOLDEN TICKET RUSH: GET READY - " + Math.round(ms / 1000) + " SECONDS ON THE CLOCK IN 5";
    }
    function gtrEnd() {
      if (GTR.ph !== "run" && GTR.ph !== "ready") return "NO ROUND RUNNING";
      GTR.gen++; GTR.ph = "done"; gtrClock();
      const top = gtrTop(); GTR.last = top.map(([id, n]) => [nameOf(id), n]);
      gtrPaint("TIME'S UP! WINNERS");
      hostMsg(top.length ? "GOLDEN TICKET RUSH WINNER: " + nameOf(top[0][0]) + " WITH " + top[0][1] + " TICKET" + (top[0][1] === 1 ? "" : "S") : "GOLDEN TICKET RUSH: NO TICKETS FOUND");
      return "GOLDEN TICKET RUSH OVER";
    }
    // the sign-in book by the board: type a name for the leaderboards
    {
      const pr = el("m-prompt", { x: GT.book[0], y: GT.book[1], z: GT.book[2], ry: 180, message: "Sign the Golden Ticket book - type the name you want on the leaderboards", placeholder: "Your name (up to 18 letters)" });
      model("cf_keypad", { sx: 3, sy: 3, sz: 3, collide: "true" }, pr);
      pr.addEventListener("prompt", (e) => {
        const id = e.detail && e.detail.connectionId; if (id === undefined) return;
        const v = String((e.detail && e.detail.value) || "").replace(/[^\w .'-]/g, "").trim().slice(0, 18);
        if (v) { NAMES.set(id, v); gtrPaint(); }
      });
    }

    // ---------------------------------------------------------------- host commands + remote status
    function command(cmd, a) {
      const v = (a[0] || "").toLowerCase();
      if (cmd === "gates") return v === "close" || v === "shut" ? gatesSet(false) : gatesSet(true);
      if (cmd === "doors" || cmd === "front") return v === "close" || v === "shut" ? frontSet(false) : frontSet(true);
      if (cmd === "main") {
        if (v === "hold") { MD.hold = true; mainOpen(0); return "THE CHOCOLATE DOORS ARE OPEN AND STAY OPEN"; }
        if (v === "close" || v === "shut") { MD.hold = false; mainClose(); return "THE CHOCOLATE DOORS ARE CLOSING"; }
        MD.hold = false; mainOpen(MAIN_OPEN_MS); return "THE CHOCOLATE DOORS ARE OPENING (" + MAIN_OPEN_MS / 1000 + " S)";
      }
      if (cmd === "door") {
        const which = v === "all" ? DOORS : [DOORS[(+a[0] || 0) - 1]].filter(Boolean);
        if (!which.length) return "DOOR NUMBER 1-" + DOORS.length + " OR ALL";
        const how = (a[1] || "open").toLowerCase();
        which.forEach((d) => how === "close" ? doorClose(d) : doorOpen(d, how === "hold" ? 0 : DOOR_OPEN_MS));
        return which.length + " DOOR(S) " + (how === "close" ? "CLOSING" : "OPEN");
      }
      if (cmd === "code") {
        const i = (+a[0] || 0) - 1, c = String(a[1] || "").replace(/\D/g, "");
        if (!DOORS[i] || c.length < 3) return "USE: CODE <1-" + DOORS.length + "> <DIGITS>";
        CODES[i] = c; return "DOOR " + (i + 1) + " (" + DOORS[i].name + ") CODE IS NOW " + c;
      }
      if (cmd === "codes") return DOORS.map((d, i) => (i + 1) + " " + d.name + ": " + CODES[i]).join(" | ");
      if (cmd === "boats") {
        if (v === "go" || v === "up") { if (BOAT.state !== "bottom") return "THE BOATS AREN'T AT THE LAGOON (" + BOAT.state.toUpperCase() + ")"; return trip(true); }
        if (v === "down" || v === "back") { if (BOAT.state !== "top") return "THE BOATS AREN'T AT FLOOR 2 (" + BOAT.state.toUpperCase() + ")"; return trip(false); }
        if (v === "reset") return boatsReset();
        if (v === "auto") { BOAT.auto = (a[1] || "on").toLowerCase() !== "off"; if (BOAT.auto && (BOAT.state === "bottom" || BOAT.state === "top")) { const gen = ++BOAT.gen; const up = BOAT.state === "bottom"; later(5000, () => { if (gen === BOAT.gen && BOAT.auto) trip(up); }); } return "BOAT AUTO " + (BOAT.auto ? "ON" : "OFF"); }
        return "BOATS: " + BOAT.state.toUpperCase() + " - " + BOAT.boats.reduce((n, b) => n + b.on.size, 0) + " ABOARD - AUTO " + (BOAT.auto ? "ON" : "OFF");
      }
      if (cmd === "lift") {                                          // lift <stop key|1-7> | lift open | lift heal
        if (v === "open" || v === "force") { const k = liftForce(); return "ELEVATOR FORCED OPEN AT THE " + LF.names[STOPS[k].k]; }
        if (v === "heal" || v === "reset") { LIFT.busy = true; LIFT.deadline = 0; heal("host"); later(300, () => arrive(LIFT.at)); return "ELEVATOR RESET AT THE " + LF.names[STOPS[LIFT.at].k]; }
        let k = STOPS.findIndex((s) => s.k === v); if (k < 0 && /^\d$/.test(v)) k = +v - 1;
        if (k < 0 || k >= STOPS.length) return "ELEVATOR STOPS: " + STOPS.map((s, i) => (i + 1) + " " + s.k).join(" / ");
        request(k); return "ELEVATOR CALLED TO THE " + LF.names[STOPS[k].k];
      }
      if (cmd === "fizzy") {
        if (v === "start") return fizzStart();
        if (v === "free") return fizzFree((a[1] || "on").toLowerCase() !== "off");
        if (v === "reset" || v === "stop") return fizzReset();
        return "FIZZY: START / FREE ON / FREE OFF / RESET";
      }
      if (cmd === "gtr" || cmd === "tickets") {
        if (v === "start") return gtrStart(+a[1] || 0);
        if (v === "end" || v === "stop") return gtrEnd();
        if (v === "reset") { GTR.gen++; GTR.ph = "idle"; GTR.score = new Map(); GTR.last = []; gtrClock(); lbl.setAttribute("content", "CLICK A BAR TO UNWRAP IT!"); return "GOLDEN TICKET RUSH RESET"; }
        return "GTR: START [SECONDS] / END / RESET";
      }
      return null;
    }
    function game() {
      const tn = now();
      return { ph: "built", gates: GATE.open, front: FD.open, main: MD.open, mainHold: MD.hold,
               doors: DOORS.map((d, i) => ({ n: i + 1, name: d.name, open: d.open, code: CODES[i] })),
               boats: { state: BOAT.state, auto: BOAT.auto, aboard: BOAT.boats.map((b) => b.on.size),
                        secs: BOAT.state === "up" || BOAT.state === "down" ? Math.round((tn - BOAT.t0) / 1000) + "/" + Math.round(BOAT.dur / 1000) : Math.max(0, Math.round((BOAT.until - tn) / 1000)) },
               lift: { at: STOPS[LIFT.at].k, stops: STOPS.map((s) => s.k), names: STOPS.map((s) => LF.names[s.k]), busy: LIFT.busy, open: LIFT.open, moving: LIFT.moving, leg: LIFT.leg,
                       target: LIFT.target !== undefined ? STOPS[LIFT.target].k : "", req: Array.from(LIFT.req).map((k) => STOPS[k].k), heals: LIFT.heals },
               fizzy: { ph: FIZZ.ph, free: FIZZ.free, left: FIZZ.bubs.filter((b) => !b.popped).length, riders: FIZZ.bubs.reduce((n, b) => n + (b.popped ? 0 : b.on.size), 0),
                        secs: Math.max(0, Math.round((FIZZ.until - tn) / 1000)), winners: FIZZ.winners },
               gtr: { ph: GTR.ph, round: GTR.round, secs: GTR.ph === "run" ? Math.max(0, Math.round((GTR.until - tn) / 1000)) : 0,
                      top: gtrTop().map(([id, n]) => [nameOf(id), n]), last: GTR.last } };
    }
    function refresh() { resync(CG, "x"); resync(CG, "y"); resync(CG, "z"); }
    return { command, game, refresh };
  }
})();
</script>
